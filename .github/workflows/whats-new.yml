name: Update What's new

# Runs at 06:00 Europe/Istanbul (03:00 UTC year-round, as Turkey stays on UTC+3).
# Summarizes any completed days with unsummarized commits into src/lib/home/whats-new.json
# using Claude Opus 5.5 (high effort), commits the update, and triggers a site deploy.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      include_today:
        description: "Also summarize today's commits so far (Europe/Istanbul)"
        required: false
        type: boolean
        default: false

concurrency:
  group: "whats-new"
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANTHROPIC_API_KEY is not set for this repository, so What's new was not updated."
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        if: steps.key.outputs.present == 'true'
        run: python -m pip install --quiet --disable-pip-version-check "anthropic>=2.8,<3"

      - name: Summarize commits
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATS_NEW_MODEL: claude-opus-5-5
          WHATS_NEW_EFFORT: high
          WHATS_NEW_INCLUDE_TODAY: ${{ inputs.include_today && 'true' || 'false' }}
        run: python .github/scripts/update_whats_new.py

      - name: Commit and push update
        id: commit
        if: steps.key.outputs.present == 'true'
        run: |
          if git diff --quiet -- src/lib/home/whats-new.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/home/whats-new.json
          git commit -m "chore(home): update what's new"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    if: needs.summarize.outputs.updated == 'true'
    needs: summarize
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.summarize.outputs.sha }}
    secrets: inherit
