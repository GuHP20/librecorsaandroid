name: Build Android APK

# Roda só quando você clicar em "Run workflow" na aba Actions.
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Incluir console de depuração dentro do app (eruda)'
        type: boolean
        default: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java (necessário para o Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Mostrar o next.config.ts (para conferir basePath nos logs)
        run: cat next.config.ts

      - name: Gerar o site estático (pasta out)
        run: npm run build

      - name: Preparar a pasta www para o Capacitor
        run: |
          rm -rf www
          cp -r out www
          # Console de depuração dentro do app (botão flutuante no canto da tela)
          if [ "${{ inputs.debug }}" = "true" ]; then
            npm install --no-save eruda
            cp node_modules/eruda/eruda.js www/eruda.js
            find www -name '*.html' | while read -r f; do
              sed -i 's#</body>#<script src="/eruda.js"></script><script>try{eruda.init()}catch(e){}</script></body>#' "$f"
            done
          fi
          # Rotas do Next exportadas como "rota.html" também ficam disponíveis como "rota/index.html"
          find www -name '*.html' ! -name 'index.html' ! -name '404.html' | while read -r f; do
            d="${f%.html}"
            mkdir -p "$d"
            cp "$f" "$d/index.html"
          done
          # Se o site foi gerado para rodar em /librecorsa (GitHub Pages),
          # os arquivos seriam procurados nesse caminho dentro do app.
          # Copiamos o site também para www/librecorsa para esses caminhos funcionarem.
          if grep -q "/librecorsa/_next" out/index.html; then
            echo "basePath /librecorsa detectado: duplicando em www/librecorsa"
            mkdir -p /tmp/site
            cp -r www/. /tmp/site/
            mkdir -p www/librecorsa
            cp -r /tmp/site/. www/librecorsa/
          fi

      - name: Adicionar o Capacitor e criar o projeto Android
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          # Config em JSON (evita o capacitor.config.ts, que depende do TypeScript do projeto)
          rm -f capacitor.config.ts capacitor.config.js
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.librecorsa.app",
            "appName": "LibreCorsa",
            "webDir": "www"
          }
          EOF
          # Recria o projeto Android do zero (só nesta cópia temporária do CI)
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Compilar o APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
